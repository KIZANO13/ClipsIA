# ClipsIA personal deployment: same-origin UI + backend, localhost-only entrypoint.
# Use ONLY behind a secure HTTPS reverse tunnel with authentication.
# docker compose -f deploy/clipia/docker-compose.yml up -d --build
services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      BILLING_ENABLED: "0"
      LLM_PROVIDER: openai
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      WHISPER_MODEL: small
      FFMPEG_THREADS: "2"
      # ClipsIA: seleção de momentos com GroqCloud (chave só no .env privado).
      LLM_PROVIDER: "openai"
      LLM_BASE_URL: "https://api.groq.com/openai/v1"
      LLM_MODEL: "${GROQ_MODEL:-openai/gpt-oss-120b}"
      LLM_API_KEY: "${GROQ_API_KEY:?Configure GROQ_API_KEY no arquivo .env privado antes de iniciar}"
      LLM_SCORE_BATCH: "3"
      LLM_TIMEOUT: "120"
    volumes:
      - outputs:/app/output
      - uploads:/app/uploads
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped

  renderer:
    build:
      context: ../..
      dockerfile: render-service/Dockerfile
    environment:
      REMOTION_BUNDLE_PATH: /app/remotion
      OUTPUT_DIR: /output
      PORT: "3100"
    volumes:
      - outputs:/output
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    depends_on:
      - backend
      - renderer
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../../dashboard/public/clipia:/usr/share/nginx/html/clipia:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  outputs:
  uploads:
  hf_cache:
